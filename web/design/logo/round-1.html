<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>ロゴを見比べる — OISHII Movie Stock</title>
  <link rel="stylesheet" href="./review.css" />
</head>
<body>
  <header class="page-header">
    <div><a class="back" href="/">OISHII Movie Stock</a><h1>ロゴを見比べる</h1></div>
    <p>まずは形から。案を選ぶと、下の実画面に反映されます。</p>
  </header>
  <main>
    <fieldset class="proposals">
      <legend class="sr-only">ロゴ案を選択</legend>
      <label class="proposal">
        <input type="radio" name="proposal" value="a" checked />
        <span class="proposal__meta"><b>A</b><span>文字のリズム</span><span class="recommended">おすすめ</span></span>
        <span class="logo-stage" data-logo="a"></span>
        <span class="proposal__description">丸いOと、端正な縦線。文字だけで覚えてもらう、すっきりしたロゴ。</span>
        <span class="specimens"><span class="specimen-light" data-logo="a"></span><span class="specimen-dark" data-logo="a"></span></span>
      </label>
      <label class="proposal">
        <input type="radio" name="proposal" value="b" />
        <span class="proposal__meta"><b>B</b><span>ストックの窓</span></span>
        <span class="logo-stage" data-logo="b"></span>
        <span class="proposal__description">積み重ねた映像と再生の窓。動画を集めた場所だと、一目で伝える。</span>
        <span class="specimens"><span class="specimen-light" data-logo="b"></span><span class="specimen-dark" data-logo="b"></span></span>
      </label>
      <label class="proposal">
        <input type="radio" name="proposal" value="c" />
        <span class="proposal__meta"><b>C</b><span>余韻の輪</span></span>
        <span class="logo-stage" data-logo="c"></span>
        <span class="proposal__description">レコードの溝のような輪と、小文字の名前。音楽の親しみを感じるロゴ。</span>
        <span class="specimens"><span class="specimen-light" data-logo="c"></span><span class="specimen-dark" data-logo="c"></span></span>
      </label>
    </fieldset>
    <section class="context" aria-labelledby="context-title">
      <div class="context-toolbar">
        <div><h2 id="context-title">実際の画面で確認</h2><p id="selection" aria-live="polite">A — 文字のリズム</p></div>
        <div class="controls">
          <div role="group" aria-label="プレビューのテーマ"><button data-theme="light" aria-pressed="true">ライト</button><button data-theme="dark" aria-pressed="false">ダーク</button></div>
          <div role="group" aria-label="プレビューの画面幅"><button data-device="desktop" aria-pressed="true">PC</button><button data-device="mobile" aria-pressed="false">スマートフォン</button></div>
          <a id="download" href="./assets/a-wordmark.svg" download>SVGを保存</a>
        </div>
      </div>
      <div class="preview-area"><div class="frame-wrap"><iframe src="/" title="選んだロゴを配置したOISHII Movie Stock" id="preview"></iframe></div></div>
    </section>
    <p class="footnote">大きい表示は形の比較用、白黒の小さい表示は横幅120px。選択はこの比較ページ内だけに反映されます。</p>
  </main>
  <script type="module" src="./review.js"></script>
</body>
</html>
