<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>B案を磨く — OISHII Movie Stock</title>
  <link rel="stylesheet" href="./review.css" />
</head>
<body>
  <header class="page-header">
    <div><a class="back" href="/">OISHII Movie Stock</a><h1>B案を磨く</h1></div>
    <p>「映像を積み重ねる窓」を、3つの表情に。</p>
  </header>
  <main>
    <fieldset class="review-group">
      <legend class="sr-only">B案のバリエーションを選択</legend>
      <label class="reference proposal">
        <input type="radio" name="proposal" value="b" />
        <span class="reference__label"><b>元のB案</b><span>ストックの窓</span></span>
        <span class="reference__logo" data-logo="b"></span>
        <span class="reference__note">太い四角の枠と、積み重ねた2本の線。クリックして元の案と比較できます。</span>
        <a href="./round-1.html">初回の3案を見る</a>
      </label>
      <div class="proposals">
        <label class="proposal">
          <input type="radio" name="proposal" value="b1" />
          <span class="proposal__meta"><b>B1</b><span>端正な窓</span></span>
          <span class="logo-stage" data-logo="b1"></span>
          <span class="proposal__description">枠を細く、文字との間を広く。余白と重心を整えた、いちばん素直な進化。</span>
          <span class="proposal__changes">枠を細く / 余白を広く</span>
          <span class="specimens"><span class="specimen-light" data-logo="b1"></span><span class="specimen-dark" data-logo="b1"></span></span>
          <span class="icon-sizes"><span>アイコン単体</span><span data-logo="b1" data-format="icon" style="--size:16px"></span><span data-logo="b1" data-format="icon" style="--size:24px"></span><span data-logo="b1" data-format="icon" style="--size:32px"></span><small>16 / 24 / 32px</small></span>
        </label>
        <label class="proposal">
          <input type="radio" name="proposal" value="b2" />
          <span class="proposal__meta"><b>B2</b><span>やわらかな窓</span></span>
          <span class="logo-stage" data-logo="b2"></span>
          <span class="proposal__description">窓の角と文字の端を丸く。軽さを残しながら、親しみのある表情に。</span>
          <span class="proposal__changes">角を丸く / 文字も柔らかく</span>
          <span class="specimens"><span class="specimen-light" data-logo="b2"></span><span class="specimen-dark" data-logo="b2"></span></span>
          <span class="icon-sizes"><span>アイコン単体</span><span data-logo="b2" data-format="icon" style="--size:16px"></span><span data-logo="b2" data-format="icon" style="--size:24px"></span><span data-logo="b2" data-format="icon" style="--size:32px"></span><small>16 / 24 / 32px</small></span>
        </label>
        <label class="proposal">
          <input type="radio" name="proposal" value="b3" checked />
          <span class="proposal__meta"><b>B3</b><span>切り抜きの窓</span><span class="recommended">採用</span></span>
          <span class="logo-stage" data-logo="b3"></span>
          <span class="proposal__description">黒い面から再生マークを切り抜く。小さくしても輪郭がはっきり残る。</span>
          <span class="proposal__changes">面を強く / 小サイズに明快</span>
          <span class="specimens"><span class="specimen-light" data-logo="b3"></span><span class="specimen-dark" data-logo="b3"></span></span>
          <span class="icon-sizes"><span>アイコン単体</span><span data-logo="b3" data-format="icon" style="--size:16px"></span><span data-logo="b3" data-format="icon" style="--size:24px"></span><span data-logo="b3" data-format="icon" style="--size:32px"></span><small>16 / 24 / 32px</small></span>
        </label>
      </div>
    </fieldset>
    <section class="context" aria-labelledby="context-title">
      <div class="context-toolbar">
        <div><h2 id="context-title">実際の画面で確認</h2><p id="selection" aria-live="polite">B3 — 切り抜きの窓</p></div>
        <div class="controls">
          <div role="group" aria-label="プレビューのテーマ"><button data-theme="light" aria-pressed="true">ライト</button><button data-theme="dark" aria-pressed="false">ダーク</button></div>
          <div role="group" aria-label="プレビューの画面幅"><button data-device="desktop" aria-pressed="true">PC</button><button data-device="mobile" aria-pressed="false">スマートフォン</button></div>
          <a id="download" href="./assets/b3-solid.svg" download>SVGを保存</a>
        </div>
      </div>
      <div class="preview-area"><div class="frame-wrap"><iframe src="/" title="選んだロゴを配置したOISHII Movie Stock" id="preview"></iframe></div></div>
    </section>
    <p class="footnote">大きい表示は形の比較用、白黒の小さい表示は横幅120px。選択はこの比較ページ内だけに反映されます。</p>
  </main>
  <script type="module" src="./review.js"></script>
</body>
</html>
